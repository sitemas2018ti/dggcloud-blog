<article class="post-row">
  {{ partial "cloud-strip.html" . }}
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>, {{ i18n "readingTime" .ReadingTime }}</p>
  <p class="summary">{{ or .Description .Summary | plainify | truncate 220 }}</p>
</article>
